
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Directory</title>
    <link rel="stylesheet" href="style.css">

    <!-- defer allows the HTML to load before the JavaScript runs -->
    <script src="users.js" defer></script>
</head>

<body>
    <main>
        <h1>User Directory</h1>

        <button id="load-users">Load Users</button>

        <label for="filter-input">Search users by name:</label>
        <input
            type="text"
            id="filter-input"
            placeholder="Enter a name..."
        >

        <p id="status">Click "Load Users" to get users.</p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
